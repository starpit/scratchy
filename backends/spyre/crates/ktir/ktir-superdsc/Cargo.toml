[package]
name = "ktir-superdsc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "KTIR -> SuperDSC: one generic lowering of a KTIR function to the descriptors dxp compiles"
publish = false

[dependencies]
# The input: a KTIR function as `ktir-core` constructs it, and the device generation's facts
# (`ddl_binds::DeviceGen`).
ktir-core = { path = "../ktir-core" }
# The output: SuperDSC is the JSON dxp reads.
serde = { workspace = true }
serde_json = { workspace = true }

# The production kernels, compiled from their Triton sources for the tests that lift them.
[dev-dependencies]
triton-frontend = { path = "../../triton/triton-frontend" }
triton-ktir = { path = "../../triton/triton-ktir" }
